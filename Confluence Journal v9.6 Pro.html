  <script type="text/babel">

    const {

    } = window.Recharts || {};

    const STORAGE_KEY = "confluence_v96_data";
    const DEFAULT_TIMEFRAMES = [

      {

        name: "4. Derivatives & Order Flow Dynamics",
        features: [

          "Aggressive Long Liquidations Flush Event",

          "Open Interest Expansion with Directional Impulse",
          "Bid/Ask Imbalance Ratio > 3:1 on Depth Chart"
        ]
      },
      {
        id: "p5",
        name: "5. HTF Trend & Macro Environment",
        features: [
          "DXY (Dollar Index) Negative Correlation Alignment",
          "US10Y Treasury Yield Directional Confluence",
          "SPX / NDX Index Market Sentiment Tailwind",
          "Fed Liquidity Index Expansion Pattern",
          "Global M2 Money Supply Growth Acceleration",
          "Bitcoin Dominance (BTC.D) Cycle Phase Alignment",
          "Gold/Silver Safe Haven Capital Flow Switch",
          "Cross-Asset Volatility Index (VIX) Compression",
          "Macro Event Clear Window (No CPI/FOMC in <2h)",

          "Sector Rotation Inflow into Target Asset Class",
          "HTF Golden Cross / Death Cross Confirmation",
          "Quarterly Cycle / Monthly Candle Vector Match",
          "Central Bank Balance Sheet Inflow Shift",
          "High-Yield Corporate Bond Spread Narrowing",
          "Commodities Energy Price Impact Neutrality",
          "Sovereign Wealth Capital Allocation Trend"
        ]
      },
      {
        id: "p6",
        name: "6. Timing & Behavioral Psychology",
        features: [
          "Fear & Greed Index Extreme Reset Level",
          "Retail Sentiment Ratio High Polarization",
          "Optimal Session Time (NY/London Open Killzone)",
          "Day of Week Statistical Bias Alignment",
          "Macro Timing Window (Monthly End Rebalance)",
          "No Active FOMO / Chase Impulse Detected",
          "Pre-Planned Entry Level Reached Without Emotion",
          "10-Minute Pre-Trade Mental Clarity Pass",
          "Risk/Reward Ratio >= 1:2.5 Fixed Pre-Set",
          "Hard Stop-Loss Placed Out of Liquidity Pools",
          "Max Daily Drawdown Allowance Fully Intact",
          "Zero Revenge Trade Triggered Flag",
          "Journal Strategy Rules Checked Explicitly",
          "Position Sizing Verified by Kelly Formula",
          "Sleep & Physical Energy Threshold Satisfied",
          "Mobile Connection & Execution Latency Verified",
          "Trading Workspace Free of External Distractions",
          "Post-Trade Exit Strategy Defined Before Entry",
          "Acceptance of Complete Financial Loss Pre-Confirmed"
        ]
      }
    ];

    function App() {
      // NAVIGATION
      const [activeTab, setActiveTab] = useState('scan'); // scan, chart, risk, pine, webhook, journal, analytics

      // TIMEFRAME STATE
      const [timeframes, setTimeframes] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY + '_tf');
        return saved ? JSON.parse(saved) : DEFAULT_TIMEFRAMES;
      });
      const [selectedTF, setSelectedTF] = useState('1h');
      
      // CUSTOM TIMEFRAME BUILDER STATE
      const [tfNumber, setTfNumber] = useState('45');
      const [tfUnit, setTfUnit] = useState('m');

      // ASSET & SCAN STATE
      const [symbol, setSymbol] = useState('BTCUSDT');
      const [tradeDirection, setTradeDirection] = useState('LONG');
      const [checkedFeatures, setCheckedFeatures] = useState({});

      // COOLDOWN & TILT ENGINE
      const [cooldownTime, setCooldownTime] = useState(0);
      const [tiltFlags, setTiltFlags] = useState({ fomo: false, revenge: false, tilt: false });

      // RISK ENGINE STATE
      const [accountBalance, setAccountBalance] = useState(10000);
      const [riskPercent, setRiskPercent] = useState(1.0);
      const [entryPrice, setEntryPrice] = useState(65000);
      const [stopLoss, setStopLoss] = useState(64000);
      const [takeProfit, setTakeProfit] = useState(68000);
      const [leverage, setLeverage] = useState(10);
      const [selectedExchange, setSelectedExchange] = useState(EXCHANGES[0]);

      // JOURNAL & STATS STATE
      const [journalTrades, setJournalTrades] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY + '_trades');
        return saved ? JSON.parse(saved) : [];
      });

      // PWA STATE
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [isPWAInstalled, setIsPWAInstalled] = useState(false);

      // WEBHOOK SIMULATOR LOGS
      const [webhookLogs, setWebhookLogs] = useState([]);

      // PERSISTENCE EFFECT
      useEffect(() => {
        localStorage.setItem(STORAGE_KEY + '_tf', JSON.stringify(timeframes));
      }, [timeframes]);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY + '_trades', JSON.stringify(journalTrades));
      }, [journalTrades]);

      // COOLDOWN TIMER COUNTDOWN
      useEffect(() => {
        if (cooldownTime <= 0) return;
        const interval = setInterval(() => {
          setCooldownTime(prev => (prev <= 1 ? 0 : prev - 1));
        }, 1000);
        return () => clearInterval(interval);
      }, [cooldownTime]);

      // PWA EVENT
      useEffect(() => {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        });
        window.addEventListener('appinstalled', () => {
          setIsPWAInstalled(true);
        });
      }, []);

      // LUCIDE ICON RENDER
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // CALCULATE SCORE (TOTAL 82 FEATURES)
      const totalFeatureCount = useMemo(() => {
        return CONFLUENCE_PILLARS.reduce((acc, p) => acc + p.features.length, 0);
      }, []);

      const checkedCount = useMemo(() => {
        return Object.values(checkedFeatures).filter(Boolean).length;
      }, [checkedFeatures]);

      const confluencePercentage = useMemo(() => {
        if (totalFeatureCount === 0) return 0;
        return Math.round((checkedCount / totalFeatureCount) * 100);
      }, [checkedCount, totalFeatureCount]);

      const confluenceScore = useMemo(() => {
        return Number(((confluencePercentage / 100) * 10).toFixed(1));
      }, [confluencePercentage]);

      // RISK CALCULATIONS ENGINE
      const riskCalc = useMemo(() => {
        const riskAmountUSD = accountBalance * (riskPercent / 100);
        const priceDiff = Math.abs(entryPrice - stopLoss);
        const rewardDiff = Math.abs(takeProfit - entryPrice);

        if (priceDiff === 0 || entryPrice === 0) {
          return { positionUnits: 0, positionValUSD: 0, grossRR: 0, netRR: 0, halfKelly: 0, feesUSD: 0, warning: '' };
        }

        const positionUnits = riskAmountUSD / priceDiff;
        const positionValUSD = positionUnits * entryPrice;
        const grossRR = rewardDiff / priceDiff;

        // Roundtrip exchange fees
        const takerFeeRate = selectedExchange.takerFee / 100;
        const feesUSD = (positionValUSD * takerFeeRate) + ((positionUnits * takeProfit) * takerFeeRate);

        const netRewardUSD = (positionUnits * rewardDiff) - feesUSD;
        const netRiskUSD = riskAmountUSD + feesUSD;
        const netRR = netRiskUSD > 0 ? (netRewardUSD / netRiskUSD) : 0;

        // Half-Kelly estimate
        const p = Math.min(0.85, Math.max(0.35, confluencePercentage / 100));
        const b = grossRR > 0 ? grossRR : 1;
        const fullKelly = (p * b - (1 - p)) / b;
        const halfKellyPct = Math.max(0, (fullKelly / 2) * 100);

        let warning = '';
        if (positionValUSD > accountBalance * leverage) {
          warning = `Position exceeds selected leverage threshold (${leverage}x)`;
        } else if (leverage >= 20) {
          warning = `High leverage (${leverage}x) increases liquidation vulnerability!`;
        } else if (tiltFlags.fomo || tiltFlags.revenge || tiltFlags.tilt) {
          warning = `Behavioral Tilt Active! Reduce risk or activate 10m Cooldown lock.`;
        }

        return {
          riskAmountUSD: riskAmountUSD.toFixed(2),
          positionUnits: positionUnits.toFixed(4),
          positionValUSD: positionValUSD.toFixed(2),
          grossRR: grossRR.toFixed(2),
          netRR: netRR.toFixed(2),
          halfKellyPct: halfKellyPct.toFixed(1),
          feesUSD: feesUSD.toFixed(2),
          warning
        };
      }, [accountBalance, riskPercent, entryPrice, stopLoss, takeProfit, leverage, selectedExchange, confluencePercentage, tiltFlags]);

      // TIMEFRAME BUILDER HANDLER
      const handleAddCustomTF = () => {
        if (!tfNumber || isNaN(tfNumber) || parseInt(tfNumber) <= 0) return;
        const createdTF = `${tfNumber}${tfUnit}`;
        if (!timeframes.includes(createdTF)) {
          setTimeframes([createdTF, ...timeframes]);
        }
        setSelectedTF(createdTF);
      };

      // CHECKLIST TOGGLE
      const toggleFeature = (feat) => {
        setCheckedFeatures(prev => ({
          ...prev,
          [feat]: !prev[feat]
        }));
      };

      const resetChecklist = () => {
        setCheckedFeatures({});
      };

      // SAVE TRADE TO JOURNAL
      const saveTradeToJournal = () => {
        if (cooldownTime > 0) {
          alert("10-minute mental cooldown lock active. Take a breather before opening new positions!");
          return;
        }

        const newTrade = {
          id: Date.now().toString(),
          date: new Date().toISOString().slice(0, 10),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          symbol,
          direction: tradeDirection,
          timeframe: selectedTF,
          score: confluenceScore,
          confluencePct: confluencePercentage,
          entryPrice,
          stopLoss,
          takeProfit,
          riskAmountUSD: riskCalc.riskAmountUSD,
          netRR: riskCalc.netRR,
          exchange: selectedExchange.name,
          tilt: { ...tiltFlags },
          status: 'PENDING', // PENDING, WIN, LOSS, BREAKEVEN
          outcomeR: 0,
          notes: `Score: ${confluenceScore}/10 (${checkedCount}/82 Features). Exchange: ${selectedExchange.name}`
        };

        setJournalTrades([newTrade, ...journalTrades]);
        alert(`Trade saved to mobile journal! [${symbol} - ${selectedTF}]`);
      };

      // UPDATE JOURNAL STATUS
      const updateTradeStatus = (id, newStatus, customR) => {
        setJournalTrades(prev => prev.map(t => {
          if (t.id === id) {
            return {
              ...t,
              status: newStatus,
              outcomeR: parseFloat(customR) || 0
            };
          }
          return t;
        }));
      };

      // BACKUP EXPORT / RESTORE
      const exportJournalJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(journalTrades, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `confluence_journal_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
      };

      const importJournalJSON = (e) => {
        const fileReader = new FileReader();
        if (e.target.files && e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (Array.isArray(parsed)) {
                setJournalTrades(parsed);
                alert("Journal backup restored successfully!");
              }
            } catch (err) {
              alert("Invalid JSON backup file.");
            }
          };
        }
      };

      // SIMULATE WEBHOOK TRIGGER
      const triggerSimulatedWebhook = () => {
        const log = {
          id: Date.now(),
          timestamp: new Date().toLocaleTimeString(),
          symbol,
          tf: selectedTF,
          direction: tradeDirection,
          score: confluenceScore,
          payload: `{"event": "SIGNAL", "symbol": "${symbol}", "tf": "${selectedTF}", "direction": "${tradeDirection}", "score": ${confluenceScore}}`
        };
        setWebhookLogs([log, ...webhookLogs]);
      };

      // PWA INSTALL TRIGGER
      const triggerPWAInstall = () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choice) => {
            if (choice.outcome === 'accepted') {
              setIsPWAInstalled(true);
            }
            setDeferredPrompt(null);
          });
        }
      };

      // PINE SCRIPT V5 GENERATOR
      const pineScriptCode = useMemo(() => {
        return `//@version=5
indicator("Confluence Engine v9.6 Alert System", overlay=true)

// User Inputs
i_symbol   = input.string("${symbol}", title="Asset Symbol")
i_tf       = input.timeframe("${selectedTF.toUpperCase()}", title="Scanning Timeframe")
i_minScore = input.float(7.5, title="Minimum Confluence Threshold", step=0.5)

// Pre-Surge Technical Calculations
ema200     = ta.ema(close, 200)
rsiVal     = ta.rsi(close, 14)
[macdLine, signalLine, _] = ta.macd(close, 12, 26, 9)

// Multi-Pillar Confluence Logic
bool c1_trend = close > ema200
bool c2_rsi   = rsiVal < 35 or (close < close[1] and rsiVal > rsiVal[1])
bool c3_macd  = ta.crossover(macdLine, signalLine)
bool c4_vol   = volume > ta.sma(volume, 20) * 1.5

float currentScore = 0.0
if c1_trend
    currentScore += 2.5
if c2_rsi
    currentScore += 2.5
if c3_macd
    currentScore += 2.5
if c4_vol
    currentScore += 2.5

// Webhook Triggers
bool longSignal  = (currentScore >= i_minScore) and ta.crossover(close, ta.ema(close, 20))
bool shortSignal = ((10.0 - currentScore) >= i_minScore) and ta.crossunder(close, ta.ema(close, 20))

plotshape(longSignal, title="Buy Signal", location=location.belowbar, color=color.yellow, style=shape.triangleup, size=size.small, text="BUY")
plotshape(shortSignal, title="Sell Signal", location=location.abovebar, color=color.red, style=shape.triangledown, size=size.small, text="SELL")

alertcondition(longSignal, title="Confluence LONG Alert", message='{"event": "LONG", "symbol": "{{ticker}}", "tf": "' + i_tf + '", "score": ' + str.tostring(currentScore) + '}')
alertcondition(shortSignal, title="Confluence SHORT Alert", message='{"event": "SHORT", "symbol": "{{ticker}}", "tf": "' + i_tf + '", "score": ' + str.tostring(currentScore) + '}')
`;
      }, [symbol, selectedTF]);

      return (
        <div className="min-h-screen flex flex-col max-w-md mx-auto bg-dark-bg border-x border-dark-border relative shadow-2xl">
          
          {/* MOBILE HEADER */}
          <header className="sticky top-0 z-40 bg-dark-card/95 backdrop-blur border-b border-dark-border p-3 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 rounded-lg bg-gold-500/20 border border-gold-500/40 flex items-center justify-center font-bold text-gold-500 text-xs">
                v9.6
              </div>
              <div>
                <h1 className="font-extrabold text-xs tracking-wider text-slate-100 flex items-center gap-1">
                  CONFLUENCE <span className="text-gold-500">PRO</span>
                </h1>
                <p className="text-[9px] text-slate-400 font-medium">Standalone Mobile Engine</p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              {cooldownTime > 0 ? (
                <div className="bg-rose-500/20 border border-rose-500/50 text-rose-400 px-2 py-1 rounded text-xs font-mono font-bold flex items-center gap-1 animate-pulse">
                  <i data-lucide="lock" className="w-3 h-3"></i>
                  {Math.floor(cooldownTime / 60)}:{(cooldownTime % 60).toString().padStart(2, '0')}
                </div>
              ) : (
                <button
                  onClick={() => setCooldownTime(600)}
                  title="Trigger 10-minute mental cooldown lock"
                  className="p-1.5 rounded-lg bg-dark-border text-slate-300 hover:text-gold-400 active:scale-95 transition"
                >
                  <i data-lucide="shield-alert" className="w-4 h-4"></i>
                </button>
              )}

              {!isPWAInstalled && deferredPrompt && (
                <button
                  onClick={triggerPWAInstall}
                  className="bg-gold-500 text-dark-bg font-extrabold text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1 active:scale-95 transition shadow"
                >
                  <i data-lucide="download" className="w-3.5 h-3.5"></i> App
                </button>
              )}
            </div>
          </header>

          {/* ASSET & TIMEFRAME RIBBON */}
          <section className="bg-dark-card/70 border-b border-dark-border p-3 space-y-2.5">
            <div className="flex items-center justify-between gap-2">
              <div className="flex items-center space-x-1.5 flex-1">
                <span className="text-[10px] text-slate-400 font-bold uppercase">PAIR:</span>
                <input
                  type="text"
                  value={symbol}
                  onChange={(e) => setSymbol(e.target.value.toUpperCase())}

                                key={st}
                                onClick={() => {
                                  const r = st === 'WIN' ? (parseFloat(trade.netRR) || 1) : st === 'LOSS' ? -1 : 0;
                                  updateTradeStatus(trade.id, st, r);
                                }}
                                className={`px-2 py-1 rounded text-[9px] font-bold transition min-h-[30px] ${
                                  trade.status === st
                                    ? st === 'WIN' ? 'bg-emerald-500 text-dark-bg' : st === 'LOSS' ? 'bg-rose-500 text-slate-100' : 'bg-slate-600 text-slate-100'
                                    : 'bg-dark-bg text-slate-400 border border-dark-border'
                                }`}
                              >
                                {st}
                              </button>
                            ))}
                          </div>

                          {trade.status !== 'PENDING' && (
                            <span className={`text-xs font-mono font-bold ${trade.outcomeR >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                              {trade.outcomeR >= 0 ? `+${trade.outcomeR}` : trade.outcomeR}R
                            </span>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB 7: PERFORMANCE ANALYTICS */}
            {activeTab === 'analytics' && (
              <div className="space-y-4">
                <div className="bg-dark-card border border-dark-border rounded-xl p-3 space-y-1">
                  <h3 className="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                    <i data-lucide="line-chart" className="w-4 h-4 text-gold-500"></i>
                    Performance Analytics
                  </h3>
                  <p className="text-[11px] text-slate-400">
                    Cumulative R profit growth computed from closed trade outcomes.
                  </p>
                </div>

                <div className="bg-dark-card border border-dark-border rounded-xl p-3 space-y-2">
                  <div className="text-xs font-bold text-slate-300">Equity Growth Curve</div>
                  <div className="h-48 w-full">
                    {LineChart ? (
                      <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={
                          journalTrades.slice().reverse().reduce((acc, trade, idx) => {
                            const prevVal = acc.length > 0 ? acc[acc.length - 1].r : 0;
                            acc.push({
                              name: `#${idx + 1}`,
                              r: prevVal + (trade.outcomeR || 0)
                            });
                            return acc;
                          }, [{ name: 'Start', r: 0 }])
                        }>
                          <CartesianGrid strokeDasharray="3 3" stroke="#1E293B" />
                          <XAxis dataKey="name" stroke="#64748B" fontSize={10} />
                          <YAxis stroke="#64748B" fontSize={10} />
                          <Tooltip contentStyle={{ backgroundColor: '#121826', borderColor: '#1E293B', fontSize: '11px' }} />
                          <Line type="monotone" dataKey="r" stroke="#D9A44A" strokeWidth={2.5} dot={{ r: 3, fill: '#D9A44A' }} />
                        </LineChart>
                      </ResponsiveContainer>
                    ) : (
                      <div className="text-center py-10 text-xs text-slate-500">Loading Recharts Engine...</div>
                    )}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2 font-mono text-xs">
                  <div className="bg-dark-card p-3 rounded-xl border border-dark-border space-y-1">
                    <div className="text-[10px] text-slate-400 font-sans">TOTAL LOGGED</div>
                    <div className="text-slate-100 font-bold text-lg">{journalTrades.length}</div>
                  </div>
                  <div className="bg-dark-card p-3 rounded-xl border border-dark-border space-y-1">
                    <div className="text-[10px] text-slate-400 font-sans">WIN RATE</div>
                    <div className="text-emerald-400 font-bold text-lg">
                      {journalTrades.filter(t => t.status !== 'PENDING').length > 0
                        ? `${Math.round((journalTrades.filter(t => t.status === 'WIN').length / journalTrades.filter(t => t.status !== 'PENDING').length) * 100)}%`
                        : '0%'
                      }
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* MOBILE BOTTOM NAVIGATION BAR */}
          <nav className="fixed bottom-0 left-0 right-0 z-50 bg-dark-card/95 backdrop-blur border-t border-dark-border max-w-md mx-auto flex items-center justify-around py-1.5 px-1">
            <button
              onClick={() => setActiveTab('scan')}
              className={`flex flex-col items-center justify-center min-w-[46px] min-h-[44px] rounded-lg text-[10px] font-medium transition ${
                activeTab === 'scan' ? 'text-gold-500 font-bold' : 'text-slate-400'
              }`}
            >
              <i data-lucide="scan-line" className="w-5 h-5 mb-0.5"></i>
              Scan
            </button>

            <button
              onClick={() => setActiveTab('chart')}
              className={`flex flex-col items-center justify-center min-w-[46px] min-h-[44px] rounded-lg text-[10px] font-medium transition ${
                activeTab === 'chart' ? 'text-gold-500 font-bold' : 'text-slate-400'
              }`}
            >
              <i data-lucide="candlestick-chart" className="w-5 h-5 mb-0.5"></i>
              Chart
            </button>

            <button
              onClick={() => setActiveTab('risk')}
              className={`flex flex-col items-center justify-center min-w-[46px] min-h-[44px] rounded-lg text-[10px] font-medium transition ${
                activeTab === 'risk' ? 'text-gold-500 font-bold' : 'text-slate-400'
              }`}
            >
              <i data-lucide="shield" className="w-5 h-5 mb-0.5"></i>
              Risk
            </button>

            <button
              onClick={() => setActiveTab('pine')}
              className={`flex flex-col items-center justify-center min-w-[46px] min-h-[44px] rounded-lg text-[10px] font-medium transition ${
                activeTab === 'pine' ? 'text-gold-500 font-bold' : 'text-slate-400'
              }`}
            >
              <i data-lucide="code" className="w-5 h-5 mb-0.5"></i>
              Pine
            </button>

            <button
              onClick={() => setActiveTab('journal')}
              className={`flex flex-col items-center justify-center min-w-[46px] min-h-[44px] rounded-lg text-[10px] font-medium transition ${
                activeTab === 'journal' ? 'text-gold-500 font-bold' : 'text-slate-400'
              }`}
            >
              <i data-lucide="book-marked" className="w-5 h-5 mb-0.5"></i>
              Journal
            </button>

            <button
              onClick={() => setActiveTab('analytics')}
              className={`flex flex-col items-center justify-center min-w-[46px] min-h-[44px] rounded-lg text-[10px] font-medium transition ${
                activeTab === 'analytics' ? 'text-gold-500 font-bold' : 'text-slate-400'
              }`}
            >
              <i data-lucide="bar-chart-3" className="w-5 h-5 mb-0.5"></i>
              Stats
            </button>
          </nav>

        </div>
      );
    }

    // Inline ServiceWorker Registration Blob for Offline Support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
          self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
